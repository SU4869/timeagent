<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2D7FF9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TimeAgent" />
  <title>TimeAgent · 智能时间管家</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 应用外壳：桌面端以"手机"形态居中呈现，移动端全幅 -->
  <div class="app-shell" id="appShell">
    <div class="phone" id="phone">

      <!-- 页面内容渲染区 -->
      <main class="view" id="view" role="main"></main>

      <!-- 底部标签栏 -->
      <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
    </div>
  </div>

  <!-- 弹窗 / 浮层挂载点 -->
  <div class="overlay" id="overlay" aria-hidden="true"></div>
  <!-- Toast 挂载点 -->
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
